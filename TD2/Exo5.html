<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Exo5</title>
    <style>
      canvas {
        border: 1px solid black;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <canvas id="drapeau" width="600" height="400"></canvas>
    <script>
      const canvas = document.getElementById("drapeau");
      const ctx = canvas.getContext("2d");
      const img = new Image();
      img.src = "Image/drapeau-algerie.png";
      const NOUVELLE_LARGEUR = 100;
      const NOUVELLE_HAUTEUR = 66;
      img.onload = function () {
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = NOUVELLE_LARGEUR;
        tempCanvas.height = NOUVELLE_HAUTEUR;
        const tempCtx = tempCanvas.getContext("2d");
        tempCtx.drawImage(img, 0, 0, NOUVELLE_LARGEUR, NOUVELLE_HAUTEUR);
        const pattern = ctx.createPattern(tempCanvas, "repeat");
        ctx.fillStyle = pattern;
        ctx.fillRect(0, 0, 600, 400);
      };
    </script>
  </body>
</html>
