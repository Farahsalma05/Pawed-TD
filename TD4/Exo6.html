<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Exo6</title>
    <style>
      #logo {
        height: auto;
        display: block;
        margin: 50px;
        animation-name: grandir;
        animation-duration: 5s;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
      }
      @keyframes grandir {
        0% {
          width: 0%;
        }
        20% {
          width: 20%;
        }
        50% {
          width: 50%;
        }
        80% {
          width: 80%;
        }
        100% {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <img id="logo" src="/TD4/Images/chat.png" style="border: 1px solid black" />
  </body>
</html>
