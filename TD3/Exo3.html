<!DOCTYPE html>
<html lang="fr"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Capture Photo</title> </head>
<body>
    <h1>Formulaire de capture photo</h1>
    
    <form action="/upload-photo" method="post" enctype="multipart/form-data">
        <label for="photo">Prendre une photo :</label>
        <input type="file" id="photo" name="photo_camera" accept="image/*" capture="user">
    </form>
</body>
</html>
