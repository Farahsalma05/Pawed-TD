<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Exo2</title>
    <style>
      .sous-menu {
        display: none;
        padding-left: 0;
      }
      .menu-principal {
        list-style-type: none;
        padding-left: 0;
        width: 250px;
        margin: 20px;
        border: 1px solid #ddd;
      }
      .menu-principal > li {
        font-weight: bold;
        cursor: pointer;
        list-style-type: none;
        position: relative;
        padding-left: 25px;
        margin: 10px 0;
      }
      .menu-principal > li::before {
        content:"";
        position: absolute;
        left: 5px;
        top: 50%;
        transform: translateY(-50%);
        width: 12px;
        height: 12px;
        /* background-image: url("/TD3/Images/puce.png"); */
        list-style-image:url("/TD3/Images/puce.png");
        /* background-size: contain;
        background-repeat: no-repeat; */
      }
      .sous-menu li {
        list-style-type: circle;
        font-weight: normal;
        margin-left: 35px;
        padding: 2px 0;
      }
    </style>
  </head>
  <body>
    <div class="conteneur-menu">
      <ul class="menu-principal">
        <li onclick="toggleSousMenu('sm-paweb')">
          PAWEB
          <ul id="sm-paweb" class="sous-menu">
            <li>Programation avancée Web</li>
          </ul>
        </li>

        <li onclick="toggleSousMenu('sm-sid')">
          SID
          <ul id="sm-sid" class="sous-menu">
            <li>Systèmes d'information distribuées</li>
          </ul>
        </li>
      </ul>
    </div>

    <script>
      function toggleSousMenu(id) {
        const sousMenu = document.getElementById(id);
        sousMenu.style.display =
        sousMenu.style.display === "block" ? "none" : "block";
      }
    </script>
  </body>
</html>
