<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Exo1</title>
  </head>
  <body>
    <h1>Où suis-je ?</h1>
    <p id="resultat">En attente de la localisation...</p>
    <button onclick="getMaPosition()">Obtenir ma Position</button>

    <script>
      function getMaPosition() {
        const resultat = document.getElementById("resultat");
        if (navigator.geolocation) {
          resultat.innerHTML = "Recherche de la position...";
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const lat = position.coords.latitude;
              const lon = position.coords.longitude;
              resultat.innerHTML = `Latitude : ${lat} <br> Longitude : ${lon}`;
            },
            (erreur) => {
              resultat.innerHTML = `Erreur : ${erreur.message}`;
            }
          );
        } else {
          resultat.innerHTML = "La géolocalisation n'est pas supportée.";
        }
      }
    </script>
  </body>
</html>
